name: Build App

on:
  workflow_call:
    inputs:
      app:
        description: App directory name
        required: true
        type: string
      architectures:
        description: JSON array of architectures to build
        required: true
        type: string

jobs:
  init:
    name: Initialize ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          echo "version=$(jq -r .version '${{ inputs.app }}/config.json')" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ inputs.architectures }}
          image-name: home-assistant-app-${{ inputs.app }}

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          cache-gha-scope: ${{ inputs.app }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ inputs.app }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ inputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: home-assistant-app-${{ inputs.app }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
