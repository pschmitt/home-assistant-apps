name: Build App

on:
  workflow_call:
    inputs:
      app:
        description: App directory name
        required: true
        type: string
      architectures:
        description: JSON array of architectures to build
        required: true
        type: string

jobs:
  lint:
    name: Lint ${{ inputs.app }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.app }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

  init:
    name: Initialize ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      extra_build_args: ${{ steps.build_args.outputs.extra_build_args }}
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: |
          echo "version=$(jq -r .version '${{ inputs.app }}/config.json')" >> "$GITHUB_OUTPUT"

      - name: Read extra build args from build.json
        id: build_args
        run: |
          if [[ -f '${{ inputs.app }}/build.json' ]]; then
            {
              echo "extra_build_args<<EOF"
              jq -r '.args // {} | to_entries[] | "\(.key)=\(.value)"' \
                '${{ inputs.app }}/build.json'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "extra_build_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ inputs.architectures }}
          image-name: home-assistant-app-${{ inputs.app }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [lint, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          build-args: ${{ needs.init.outputs.extra_build_args }}
          cache-gha-scope: ${{ inputs.app }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ inputs.app }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ inputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: home-assistant-app-${{ inputs.app }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
