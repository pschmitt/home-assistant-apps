name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: avahi-reflector
          - app: flicd
          - app: keepalived
          - app: picamera
          - app: tailscale
          - app: zabbix-agent
          - app: zabbix-agent2
          - app: ais-catcher
    steps:
      - uses: actions/checkout@v7
      - name: Install hadolint
        run: |
          curl -sSLo /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      - name: Lint
        run: hadolint --config "$GITHUB_WORKSPACE/.hadolint.yaml" "${{ matrix.app }}/Dockerfile"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
